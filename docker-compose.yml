version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: signal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-seed-admin:
    image: postgres:15-alpine
    container_name: postgres-seed-admin
    restart: "no"
    depends_on:
      postgres:
        condition: service_started
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: signal_db
      PGUSER: user
      PGPASSWORD: password
      SEED_SQL: |-
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
        INSERT INTO users (
            id, user_id, username, password_hash, email, role, created_at, updated_at
        )
        SELECT
            gen_random_uuid()::text,
            'usr_admin_ui',
            'admin-ui',
            crypt('Admin@1234!', gen_salt('bf')),
            'admin-ui@marcus.local',
            'ADMIN',
            CURRENT_TIMESTAMP,
            CURRENT_TIMESTAMP
        WHERE NOT EXISTS (
            SELECT 1
            FROM users
            WHERE username = 'admin-ui'
               OR email = 'admin-ui@marcus.local'
        );
    entrypoint:
      - /bin/sh
      - -lc
      - until pg_isready -h postgres -p 5432 -U user; do echo "waiting for postgres..."; sleep 2; done; printf "%s\n" "$$SEED_SQL" | psql -h postgres -p 5432 -U user -d signal_db -v ON_ERROR_STOP=1

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-ui
    ports:
      - "5540:5540"
    restart: unless-stopped
    volumes:
      - redisinsight_data:/data

  kafka:
    image: bitnamilegacy/kafka:3.7.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092" # Chỉ cần mở cổng này ra môi trường ngoài
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker

      # Gán cứng Controller kết nối nội bộ qua port 9093
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093

      # Định nghĩa rõ ràng 3 Listener riêng biệt
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_LISTENERS=INTERNAL://0.0.0.0:9094,EXTERNAL://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093

      # Quảng bá IP đúng định dạng cho Client ngoài
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9094,EXTERNAL://171.244.195.150:9092

      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  marcus-backend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: marcus-backend:latest
    container_name: marcus-backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_started
      db-seed-admin:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/signal_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kyc-documents
    restart: unless-stopped

  marcus-nextjs:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: marcus-nextjs:latest
    container_name: marcus-nextjs
    ports:
      - "3000:3000"
    depends_on:
      - marcus-backend
    # environment:
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  pgadmin_data:
  redisinsight_data:
  minio_data:

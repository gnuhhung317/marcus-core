spring:
  application:
    name: marcus-parent
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/signal_db?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: marcus-signal-dispatcher
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: io.marcus.domain,io.marcus.domain.model
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false
    baseline-on-migrate: true
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://redis:6379}
      host: 171.244.195.150
      port: 6379

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    listener:
      ack-mode: record # xử lý từng message

marcus:
  messaging:
    signal-storage-topic: trading-signals
    signal-storage-group: marcus-signal-storage
    signal-storage-batch-size: 100

  security:
    master-key: coleemchangkhocchutnaocoleemchangquantamanhrasao
    salt: 944440b12311f820b2cf6acd2290b497
    compressed-request:
      max-bytes: ${MARCUS_SECURITY_COMPRESSED_REQUEST_MAX_BYTES:104857600}
    bot-signature:
      max-skew-ms: 60000
    jwt:
      secret: marcus-super-secret-key-change-me-at-least-32-bytes
      access-token-expiration-seconds: 3600000
      refresh-token-expiration-seconds: 60480000

  server:
    port: 8080
